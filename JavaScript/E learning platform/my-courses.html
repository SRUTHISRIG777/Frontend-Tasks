<!DOCTYPE html>
<html>
<head>
  <title>My Courses</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .course {
      background: white;
      padding: 15px;
      margin: 15px auto;
      width: 300px;
      border-radius: 10px;
    }

    button {
      padding: 8px 12px;
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* 🔷 Progress Bar */
    .progress-bar {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-fill {
      height: 15px;
      background: #2ecc71;
      width: 0%;
    }
  </style>
</head>

<body>

<h2>My Courses</h2>

<div id="list"></div>

<script src="js/my-courses.js">
</script>

</body>
</html>
